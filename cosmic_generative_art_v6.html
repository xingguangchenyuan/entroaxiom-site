<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050506" id="themeColor">
<title>Cosmic Glyphs — Generative Frontend Art</title>
<style>
:root{--bg:#050506;--fg:#eee;--dim:#8a8a8a;--ui-bg:#050506b8;--ui-line:#ffffff1c;--ui-hover:#ffffff12;--ui-on:#fff;--gold:#e5bf32;--paper:#e9e8e2;--ink:#111214}
body[data-theme="paper"]{--bg:var(--paper);--fg:var(--ink);--dim:#77756e;--ui-bg:#e9e8e2d0;--ui-line:#1112141f;--ui-hover:#11121412;--ui-on:var(--ink)}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100svh;overflow-x:hidden;background:var(--bg);color:var(--fg);font-family:Inter,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;transition:background .6s ease,color .6s ease}
.scene{min-height:100svh;position:relative;overflow:hidden;display:grid;place-items:center}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
canvas.stip,canvas.live{z-index:0}
.art{width:min(94vw,88svh,900px);height:min(94vw,88svh,900px);position:relative;z-index:3;transition:transform .25s ease-out,opacity .28s ease;will-change:transform}
.art.out{opacity:0}
svg{width:100%;height:100%;overflow:visible;position:relative;z-index:1}
.line{fill:none;stroke-linecap:round;stroke-linejoin:round}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 90s linear infinite}
.spin2{transform-box:fill-box;transform-origin:center;animation:spin 160s linear infinite reverse}
.spin3{transform-box:fill-box;transform-origin:center;animation:spin 240s linear infinite}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 7s ease-in-out infinite}
.tw{animation:tw 5s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.03);opacity:.8}}
@keyframes tw{50%{opacity:.35}}
.grain{position:fixed;inset:-90px;z-index:9;pointer-events:none;opacity:.3;background-image:var(--g1);background-size:160px;animation:grain 1s steps(1) infinite}
body[data-theme="paper"] .grain{background-image:var(--g2);opacity:.4}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-37px,23px)}40%{transform:translate(29px,-41px)}60%{transform:translate(-18px,-52px)}80%{transform:translate(44px,17px)}}
.vignette{position:fixed;inset:0;z-index:8;pointer-events:none;background:radial-gradient(circle,transparent 38%,#000b 100%);transition:background .6s}
body[data-theme="paper"] .vignette{background:radial-gradient(circle,transparent 55%,#8a877c40 100%)}
.caption{position:fixed;z-index:10;left:50%;bottom:92px;transform:translateX(-50%);text-align:center;letter-spacing:.28em;pointer-events:none;white-space:nowrap}
.caption b{font-weight:400;font-size:13px}
.caption small{display:block;margin-top:8px;color:var(--dim);font-size:9px;letter-spacing:.22em}
.ui{position:fixed;z-index:20;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:2px;padding:6px;max-width:min(96vw,820px);overflow-x:auto;scrollbar-width:none;border:1px solid var(--ui-line);border-radius:999px;background:var(--ui-bg);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.ui::-webkit-scrollbar{display:none}
button{flex:none;border:0;background:transparent;color:var(--dim);padding:9px 12px;border-radius:999px;font:inherit;font-size:10px;letter-spacing:.12em;cursor:pointer;transition:background .2s,color .2s}
button.active,button:hover{background:var(--ui-hover);color:var(--ui-on)}
button:focus-visible{outline:1px solid var(--ui-on);outline-offset:-2px}
@media(max-width:600px){.ui{bottom:max(14px,env(safe-area-inset-bottom))}.caption{bottom:80px}}
@media(prefers-reduced-motion:reduce){.spin,.spin2,.spin3,.pulse,.tw,.grain{animation:none}.art{transition:none}}
</style>
</head>
<body data-theme="dark">
<div class="scene" id="scene">
<canvas class="stars" id="stars"></canvas>
<canvas class="dust" id="dust"></canvas>
<div class="art" id="art"></div>
<div class="grain"></div>
<div class="vignette"></div>
<div class="caption"><b id="cap"></b><small id="sub"></small></div>
<nav class="ui" id="ui" aria-label="Modes"></nav>
</div>
<script>
const $=s=>document.querySelector(s);
const art=$("#art"),scene=$("#scene"),capEl=$("#cap"),subEl=$("#sub"),ui=$("#ui");
const S=$("#stars"),D=$("#dust"),sx=S.getContext("2d"),dx=D.getContext("2d");
const RM=matchMedia("(prefers-reduced-motion:reduce)").matches;
const TAU=Math.PI*2,R=(a,b)=>a+Math.random()*(b-a),f1=n=>(+n).toFixed(1);
const BONE="233,232,226",GOLD="229,191,50",CYAN="47,196,212",VIOLET="155,140,240",rgba=(c,a)=>`rgba(${c},${a})`;
let W=innerWidth,H=innerHeight,dpr=1,stars=[],dust=[],cur=null,raf=0,liveFn=null,liveCtx=null;

/* ---------- 工具 ---------- */
function rng(s){return()=>{s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function mk(seed){const f=rng(seed),r=(a,b)=>a+f()*(b-a);r.f=f;return r}
function makeNoise(seed){const f=rng(seed),g=Array.from({length:289},()=>f()),sm=t=>t*t*(3-2*t);
 return(x,y)=>{const xi=Math.floor(x),yi=Math.floor(y),xf=sm(x-xi),yf=sm(y-yi),h=(i,j)=>g[(i&15)+(j&15)*17];
  const a=h(xi,yi),b=h(xi+1,yi),c=h(xi,yi+1),d=h(xi+1,yi+1);return(a+(b-a)*xf)*(1-yf)+(c+(d-c)*xf)*yf}}
const gauss=r=>(r.f()+r.f()+r.f()+r.f()-2)*1.73;
const norm3=(x,y,z)=>{const l=Math.hypot(x,y,z);return[x/l,y/l,z/l]};
const dot=(c,x,y,s,o)=>{c.globalAlpha=o;c.beginPath();c.arc(x,y,s,0,TAU);c.fill()};
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
function glow(ctx,x,y,rad,c,a){const g=ctx.createRadialGradient(x,y,0,x,y,rad);g.addColorStop(0,`rgba(${c},${a})`);g.addColorStop(.4,`rgba(${c},${a*.32})`);g.addColorStop(1,`rgba(${c},0)`);ctx.fillStyle=g;ctx.fillRect(x-rad,y-rad,rad*2,rad*2)}
function runeSegs(r){const g=[[-.5,-1],[0,-1],[.5,-1],[-.5,0],[0,0],[.5,0],[-.5,1],[0,1],[.5,1]],n=2+((r.f()*3)|0),segs=[];let c=(r.f()*9)|0;
 for(let i=0;i<n;i++){let nx=(r.f()*9)|0;if(nx===c)nx=(nx+4)%9;segs.push([g[c],g[nx]]);c=nx}return segs}
function runePath(ctx,segs,x,y,s,ang){ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.scale(s,s);for(const[a,b]of segs){ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1])}ctx.restore()}
/* 四角星（凹边），s 为臂长，k 越小越尖细 */
const star4=(s,k=.1)=>`M0 ${-s}Q${f1(s*k)} ${f1(-s*k)} ${s} 0Q${f1(s*k)} ${f1(s*k)} 0 ${s}Q${f1(-s*k)} ${f1(s*k)} ${-s} 0Q${f1(-s*k)} ${f1(-s*k)} 0 ${-s}Z`;
/* 一笔"飘带"：两端为零、中段最粗的弧形多边形，是整套风格里唯一的粗线条 */
function taper(Rr,a0,a1,wmax,pw=1.5){const n=100,o=[],q=[];
 for(let i=0;i<=n;i++){const t=i/n,a=a0+(a1-a0)*t,w=wmax*Math.pow(Math.sin(Math.PI*t),pw)/2;
  o.push(`${f1((Rr+w)*Math.cos(a))} ${f1((Rr+w)*Math.sin(a))}`);q.push(`${f1((Rr-w)*Math.cos(a))} ${f1((Rr-w)*Math.sin(a))}`)}
 return`M${o.join("L")}L${q.reverse().join("L")}Z`}
const dotted=(Rr,c,w,gap,op)=>`<circle class="line" r="${Rr}" stroke="${c}" stroke-width="${w}" stroke-dasharray="0.1 ${gap}" opacity="${op}"/>`;

/* ---------- 背景层 ---------- */
function sizeCanvas(c,x){c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);sizeCanvas(S,sx);sizeCanvas(D,dx);seed();if(RM)backdrop(0)}
function seed(){
 stars=Array.from({length:Math.min(300,Math.floor(W*H/6000))},()=>({x:R(0,W),y:R(0,H),r:R(.15,1.2),a:R(.15,.8),p:R(0,6.28)}));
 dust=Array.from({length:Math.min(900,Math.floor(W*H/2200))},()=>({x:R(0,W),y:R(0,H),r:R(.2,1.5),vx:R(-.06,.06),vy:R(-.04,.04),a:R(.05,.4)}));
}
function backdrop(t){
 sx.clearRect(0,0,W,H);dx.clearRect(0,0,W,H);
 if(!cur)return;
 if(cur.theme==="dark"){sx.fillStyle="#fff";
  for(const p of stars){sx.globalAlpha=p.a*(RM?1:.55+.45*Math.sin(t*.0014+p.p));sx.beginPath();sx.arc(p.x,p.y,p.r,0,TAU);sx.fill()}}
 if(cur.dust){const paper=cur.theme==="paper";dx.fillStyle=paper?"#111214":"#e9e8e2";
  for(const p of dust){if(!RM){p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=W;if(p.x>W)p.x=0;if(p.y<0)p.y=H;if(p.y>H)p.y=0}
   dx.globalAlpha=p.a*(paper?.7:1);dx.beginPath();dx.arc(p.x,p.y,p.r,0,TAU);dx.fill()}}
}
let tx=0,ty=0,mx=0,my=0;
addEventListener("pointermove",e=>{tx=e.clientX/W-.5;ty=e.clientY/H-.5});
function drawLive(t){const c=liveCtx;c.setTransform(2,0,0,2,0,0);c.clearRect(0,0,800,800);c.globalCompositeOperation="source-over";c.globalAlpha=1;liveFn(c,t)}
function frame(t){
 mx+=(tx-mx)*.04;my+=(ty-my)*.04;
 art.style.transform=`translate3d(${(mx*16).toFixed(2)}px,${(my*16).toFixed(2)}px,0)`;
 backdrop(t);if(liveFn)drawLive(t);raf=requestAnimationFrame(frame)
}
addEventListener("resize",resize);
(function grainTiles(){
 const mkTile=rgb=>{const c=document.createElement("canvas");c.width=c.height=160;const x=c.getContext("2d"),im=x.createImageData(160,160);
  for(let i=0;i<im.data.length;i+=4){im.data[i]=rgb[0];im.data[i+1]=rgb[1];im.data[i+2]=rgb[2];im.data[i+3]=Math.random()<.22?Math.random()*75:0}
  x.putImageData(im,0,0);return`url(${c.toDataURL()})`};
 document.documentElement.style.setProperty("--g1",mkTile([255,255,255]));
 document.documentElement.style.setProperty("--g2",mkTile([17,18,20]));
})();

/* ---------- 场景装配：SVG（矢量线稿）+ 静态 canvas（点刻/笔触）+ 实时 canvas（逐帧） ---------- */
function baseDefs(){return `
<defs>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="8"/></filter>
</defs>`}
function setScene(body,paint,o={}){
 liveFn=null;liveCtx=null;
 art.innerHTML=`${paint?'<canvas class="stip"></canvas>':""}${o.live?'<canvas class="live"></canvas>':""}<svg viewBox="0 0 800 800" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${cur.cap}">${baseDefs()}${body}</svg>`;
 if(paint){const c=art.querySelector("canvas.stip");c.width=c.height=1600;const x=c.getContext("2d");x.scale(2,2);paint(x)}
 if(o.live){const c=art.querySelector("canvas.live");c.width=c.height=1600;liveCtx=c.getContext("2d");liveFn=o.live;if(RM)drawLive(0)}
 if(RM)art.querySelector("svg").pauseAnimations();
}
const anchor=r=>`<circle r="${r}" fill="none" stroke="none"/>`;
function ticks(Rad,n,long,short,every,stroke,op){let d="";
 for(let i=0;i<n;i++){const a=i/n*TAU,l=i%every===0?long:short,c=Math.cos(a),s=Math.sin(a);d+=`M${f1(c*Rad)} ${f1(s*Rad)}L${f1(c*(Rad-l))} ${f1(s*(Rad-l))}`}
 return`<path class="line" d="${d}" stroke="${stroke}" opacity="${op}"/>`}
function orbit(rx,ry,rot,dur,rad,fill,delay=0){
 const p=`M${rx} 0A${rx} ${ry} 0 1 1 ${-rx} 0A${rx} ${ry} 0 1 1 ${rx} 0`;
 return`<g transform="rotate(${rot})"><circle r="${rad}" fill="${fill}"><animateMotion dur="${dur}s" begin="${-delay}s" repeatCount="indefinite" path="${p}"/></circle></g>`}
function stippleBall(ctx,r,vn,cx,cy,Rad,L,o){
 const{n,base=.1,hi=1,gam=1.15,d0=.35,d1=1,skip}=o;
 for(let i=0;i<n;i++){
  const a=r.f()*TAU,d=Math.sqrt(r.f())*Rad,x=Math.cos(a)*d,y=Math.sin(a)*d;
  if(skip&&skip(x,y))continue;
  const nx=x/Rad,ny=y/Rad,nz=Math.sqrt(Math.max(0,1-nx*nx-ny*ny));
  const lit=clamp(nx*L[0]+ny*L[1]+nz*L[2]);
  let p=base+(hi-base)*Math.pow(1-lit,gam);
  p*=.8+.45*vn(nx*3.2+cx*.01,ny*3.2+cy*.01);
  if(r.f()<Math.pow(Math.min(1,p),1.5))dot(ctx,cx+x,cy+y,r(d0,d1),r(.5,.95));
 }
}

/* ============================================================
   01 SPIRAL 时之螺旋：一串逐渐"满"起来的青色点，绕着一颗四角星缓缓转
   ============================================================ */
function spiral(){
 const C="#2fc4d4",N=150;let dots="";
 for(let i=0;i<N;i++){const t=i/(N-1),a=t*TAU*3.2,rad=20+t*255,sz=.5+Math.pow(t,1.7)*5.4;
  dots+=`<circle cx="${f1(Math.cos(a)*rad)}" cy="${f1(Math.sin(a)*rad)}" r="${f1(sz)}" fill="${C}" opacity="${(.3+.7*t).toFixed(2)}"/>`}
 setScene(`<g transform="translate(400 400)">
<path class="line" d="M-392 0H-52M52 0H392M0-392V-52M0 52V392" stroke="#e9e8e2" stroke-width=".8" opacity=".75"/>
<circle class="line" r="372" stroke="#e9e8e2" opacity=".16"/>
${dotted(318,C,3.2,13,.8)}
<g class="spin3">${anchor(285)}${dots}</g>
<path d="${star4(44,.09)}" fill="#e9e8e2"/>
<circle r="2.6" fill="${C}"/>
</g>`)
}

/* ============================================================
   02 HORIZON 视界：一个黑盘，三笔飘带，一条发丝线
   ============================================================ */
function horizon(){
 const G="#e5bf32",B="#e9e8e2";
 setScene(`<g transform="translate(400 400)">
<path class="line" d="M-392 0H392" stroke="${B}" stroke-width=".7" opacity=".55"/>
<circle r="74" fill="none" stroke="${G}" stroke-width="16" opacity=".4" filter="url(#softGlow)"/>
<g class="spin3">${anchor(205)}<path d="${taper(134,-2.9,.5,15)}" fill="${B}"/></g>
<g class="spin2">${anchor(205)}<path d="${taper(160,.2,3.5,5.5)}" fill="${G}" filter="url(#glow)"/></g>
<g class="spin">${anchor(205)}<path d="${taper(198,-1.3,1.9,2)}" fill="${B}" opacity=".85"/></g>
${dotted(100,B,1.6,8,.5)}
<circle r="66" fill="#000" stroke="${B}" stroke-width=".9"/>
<path d="${star4(15,.1)}" fill="${B}" transform="translate(262 -196)"/>
<path d="${star4(10,.1)}" fill="${B}" opacity=".8" transform="translate(-282 160)"/>
<circle cx="-384" r="3" fill="${G}"/><circle cx="384" r="3" fill="${G}"/>
</g>`)
}

/* ============================================================
   03 EDGE-ON 侧向星系：一盘点，中间一道暗带，其中一颗星被圈了出来
   ============================================================ */
function edgeon(){
 const r=mk(12),vn=makeNoise(44),warp=x=>10*Math.sin(x/110+1)*Math.min(1,Math.abs(x)/200);
 setScene(``,ctx=>{
  for(let i=0;i<90;i++){ctx.fillStyle=rgba(BONE,r(.1,.6));const s=r(.4,1.3);ctx.fillRect(r(0,800),r(0,800),s,s)}
  ctx.save();ctx.translate(400,400);ctx.rotate(-.3);ctx.globalCompositeOperation="lighter";
  for(let i=0;i<200000;i++){
   const x=(r.f()<.5?-1:1)*(-Math.log(1-r.f()*.985))*105;if(Math.abs(x)>345)continue;
   const bulge=Math.exp(-(x*x)/(2*62*62)),y=gauss(r)*(4+36*bulge)+warp(x);
   if(Math.abs(y-warp(x)-2)<3&&Math.abs(x)>50&&r.f()<.85)continue;
   const nz=vn(x*.035+5,y*.12+2);if(r.f()>.25+.9*nz)continue;
   if(bulge>.12&&r.f()<.6*bulge)continue;
   ctx.fillStyle=bulge>r.f()*.95?rgba("255,226,150",r(.06,.3)):rgba(BONE,r(.1,.7)*(1-Math.abs(x)/520));
   const s=r(.35,1.2);ctx.fillRect(x,y,s,s)}
  glow(ctx,0,0,120,GOLD,.14);
  ctx.globalCompositeOperation="source-over";
  const mx_=212,my_=warp(212);ctx.strokeStyle=rgba(CYAN,.95);ctx.lineWidth=.9;
  ctx.beginPath();ctx.arc(mx_,my_,11,0,TAU);ctx.moveTo(mx_,my_-15);ctx.lineTo(mx_,my_-74);ctx.stroke();
  ctx.fillStyle=rgba(CYAN,1);ctx.beginPath();ctx.arc(mx_,my_,2.2,0,TAU);ctx.fill();
  ctx.restore();
 })
}

/* ============================================================
   04 FOUCAULT 傅科摆：一颗光点沿一条缓缓转向的直线来回，留下的轨迹织成扇形
   ============================================================ */
function foucault(){
 setScene(`<g transform="translate(400 400)">
${dotted(300,"#9b8cf0",3,12,.7)}
<path class="line" d="M-392 0H-326M326 0H392M0-392V-326M0 326V392" stroke="#e9e8e2" stroke-width=".8" opacity=".6"/>
<path d="${star4(22,.1)}" fill="#e9e8e2"/>
</g>`,null,{live:(ctx,t)=>{
  const A=272,w=TAU/10000,wp=.000032,psi0=.4;
  const pos=tt=>{const s=Math.sin(tt*w),p=psi0+tt*wp;return[400+A*s*Math.cos(p),400+A*s*Math.sin(p)]};
  ctx.globalCompositeOperation="lighter";ctx.lineWidth=.7;
  const SPAN=100000,STEP=60,B=22;
  for(let b=0;b<B;b++){const t0=t-SPAN+SPAN*b/B,t1=t-SPAN+SPAN*(b+1)/B;
   ctx.strokeStyle=rgba(VIOLET,.04+.6*Math.pow((b+1)/B,2.2));ctx.beginPath();let p=pos(t0);ctx.moveTo(p[0],p[1]);
   for(let tt=t0+STEP;tt<=t1+STEP;tt+=STEP){p=pos(tt);ctx.lineTo(p[0],p[1])}ctx.stroke()}
  const p=pos(t);
  ctx.strokeStyle=rgba(VIOLET,.28);ctx.lineWidth=.8;ctx.beginPath();ctx.moveTo(400,400);ctx.lineTo(p[0],p[1]);ctx.stroke();
  glow(ctx,p[0],p[1],34,VIOLET,.95);ctx.globalCompositeOperation="source-over";
  ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(p[0],p[1],3.4,0,TAU);ctx.fill();
 }})
}

/* ============================================================
   05 OUROBOROS 衔尾蛇 · 全视之眼：蛇身一笔由细渐粗、咬住自己的尾，环中三角里睁着一只眼
   ============================================================ */
function ouroboros(){
 const G="#e5bf32",B="#e9e8e2",N=260,sweep=6.2,headAng=.27,a0=-Math.PI/2+.1;
 const wf=s=>{if(s<=1)return 3+27*Math.pow(s,1.3);const u=(s-1)/.3;return 30+6*Math.sin(u*Math.PI*.8)-14*u*u};
 const rf=s=>232+18*Math.min(1,s*1.4);
 const af=s=>s<=1?a0+s*(sweep-headAng):a0+(sweep-headAng)+(s-1)/.3*headAng;
 const pt=(s,off)=>{const a=af(s),q=rf(s)+off;return[q*Math.cos(a),q*Math.sin(a)]};
 const out=[],inn=[];
 for(let i=0;i<=N;i++){const s=i/N*1.3,w=wf(s)/2,o=pt(s,w),n=pt(s,-w);out.push(`${f1(o[0])} ${f1(o[1])}`);inn.push(`${f1(n[0])} ${f1(n[1])}`)}
 const body=`M${out.join("L")}L${inn.reverse().join("L")}Z`;
 let hatch="";
 for(let s=.07;s<1.02;s+=.0105){const w=wf(s)/2,o=pt(s,w*.98),n=pt(s+.004,-w*.98);hatch+=`M${f1(o[0])} ${f1(o[1])}L${f1(n[0])} ${f1(n[1])}`}
 const eyeP=pt(1.12,wf(1.12)*.16);
 // 环内射线：长短相间
 let rays="";
 for(let i=0;i<72;i++){const a=i/72*TAU,l=i%6===0?34:i%2===0?18:9,c=Math.cos(a),s_=Math.sin(a);
  rays+=`M${f1(c*184)} ${f1(s_*184)}L${f1(c*(184+l))} ${f1(s_*(184+l))}`}
 const tri=[[0,-166],[144,83],[-144,83]];
 setScene(`<g transform="translate(400 400)">
<path class="line" d="M0-392V-352M0 352V392M-392 0H-352M352 0H392" stroke="${B}" stroke-width=".8" opacity=".6"/>
${dotted(318,G,3,13,.75)}
<g class="spin3">${anchor(290)}
 <path d="${body}" fill="${B}"/>

</g>`)

/* ============================================================
   06 ENSO 空：纸上一笔圆相，飞白，一粒朱砂
   ============================================================ */
function enso(){
 const r=mk(66),vn=makeNoise(9),seal=runeSegs(r);
 setScene(``,ctx=>{
  for(let i=0;i<14;i++){const x=r(220,580),y=r(220,580),rad=r(90,170),g=ctx.createRadialGradient(x,y,0,x,y,rad);
   g.addColorStop(0,"rgba(138,135,124,.08)");g.addColorStop(1,"rgba(138,135,124,0)");ctx.fillStyle=g;ctx.fillRect(x-rad,y-rad,rad*2,rad*2)}
  const cx=400,cy=402,R0=205,a0=-1.05,a1=a0+TAU*.93,wf=t=>(10+38*Math.pow(1-t,1.3))*(.85+.3*vn(t*6,3));
  ctx.lineCap="round";ctx.strokeStyle="#111214";
  const NB=150;
  for(let b=0;b<NB;b++){const u=b/(NB-1)-.5,segs=300;let prev=null;ctx.beginPath();
   for(let s=0;s<=segs;s++){const t=s/segs,a=a0+(a1-a0)*t,rad=R0+u*wf(t)+(vn(t*4+b*.07,7)-.5)*6,x=cx+Math.cos(a)*rad,y=cy+Math.sin(a)*rad;
    const keep=r.f()<(1-.55*t)*(1-Math.abs(u)*.6)*(.5+.65*vn(t*34+b*.3,2));
    if(keep&&prev){ctx.moveTo(prev[0],prev[1]);ctx.lineTo(x,y)}prev=[x,y]}
   ctx.globalAlpha=r(.45,.9);ctx.lineWidth=r(.8,1.6);ctx.stroke()}
  ctx.fillStyle="#111214";
  for(let i=0;i<700;i++){const t=Math.pow(r.f(),3)*.12,a=a0+(a1-a0)*t,rad=R0+(r.f()-.5)*wf(t)*1.05;dot(ctx,cx+Math.cos(a)*rad,cy+Math.sin(a)*rad,r(.4,1.9),r(.3,.8))}
  for(let i=0;i<90;i++){const a=r(0,TAU),rad=R0+r(36,120)*(r.f()<.5?1:-1);dot(ctx,cx+Math.cos(a)*rad,cy+Math.sin(a)*rad,r(.4,2),r(.25,.7))}
  ctx.globalAlpha=1;ctx.fillStyle="#c8372d";ctx.beginPath();ctx.arc(cx,cy,5,0,TAU);ctx.fill();
  ctx.save();ctx.translate(604,606);ctx.rotate(.06);ctx.fillStyle="#c8372d";ctx.fillRect(0,0,26,26);
  ctx.strokeStyle="#e9e8e2";ctx.lineWidth=1.5;ctx.strokeRect(5,5,16,16);ctx.beginPath();ctx.moveTo(13,5);ctx.lineTo(13,21);ctx.moveTo(5,13);ctx.lineTo(21,13);ctx.stroke();ctx.restore();
 })
}

/* ============================================================
   07 PHASE 月相：纸底点刻，一颗受光球 + 一圈月相 + 符文环
   ============================================================ */
function phase(){
 const r=mk(6),vn=makeNoise(33),rn=mk(66),cx=400,cy=330,OR=300,L=a=>norm3(Math.sin(a),-.08,Math.cos(a));
 const runes=Array.from({length:60},()=>runeSegs(rn));
 setScene(`<g transform="translate(${cx} ${cy})">
<g class="spin2" opacity=".6">${anchor(345)}${ticks(326,72,9,4,6,"#111214",.5)}</g>
<circle class="line" r="198" stroke="#111214" opacity=".28" stroke-dasharray="1 6"/>
${orbit(OR,OR,0,70,3.6,"#111214")}
</g>
<path class="line" d="M48 100V48H100M700 48H752M752 700V752H700M100 752H48V700" stroke="#111214" stroke-width="1.1" opacity=".5"/>`,ctx=>{
  ctx.fillStyle="#111214";
  for(let i=0;i<60000;i++){const x=r(0,800),y=r(0,800);if(Math.hypot(x-cx,y-cy)<165)continue;
   const u1=(x-y*.55-60)/230,u2=(x-y*.55-440)/190,band=Math.exp(-u1*u1)+.7*Math.exp(-u2*u2),d=band*(.25+1.1*vn(x*.012,y*.012));
   if(r.f()<d*.16)dot(ctx,x,y,r(.25,.75),r(.06,.3))}
  stippleBall(ctx,r,vn,cx,cy,150,L(1.25),{n:95000,base:.05,hi:.82,gam:1.2,d0:.4,d1:1.05});
  const sp=[];for(let i=0;i<9;i++){const th=(30+120*i/8)*Math.PI/180;sp.push([cx+Math.cos(th)*OR,cy+Math.sin(th)*OR,Math.PI-i*Math.PI/4])}
  for(const[x,y,a]of sp)stippleBall(ctx,r,vn,x,y,26,L(a),{n:5200,base:.05,hi:.8,gam:1.2,d0:.3,d1:.75});
  for(let a=0;a<360;a+=1.5){const q=a*Math.PI/180,x=cx+Math.cos(q)*OR,y=cy+Math.sin(q)*OR;
   if(sp.some(s=>Math.hypot(s[0]-x,s[1]-y)<34))continue;dot(ctx,x,y,.6,.55)}
  ctx.strokeStyle="#111214";ctx.lineWidth=.8;ctx.globalAlpha=.6;
  for(let i=0;i<60;i++){const a=i/60*TAU+.03,x=cx+Math.cos(a)*352,y=cy+Math.sin(a)*352;if(y<14)continue;ctx.beginPath();runePath(ctx,runes[i],x,y,5.5,a+Math.PI/2);ctx.stroke()}
  ctx.globalAlpha=1;
  for(let i=0;i<1400;i++){const x=r(20,780),y=r(20,780);if(Math.hypot(x-cx,y-cy)<158)continue;dot(ctx,x,y,r(.25,.7),r(.1,.45))}
 })
}

/* ============================================================
   08 ECLIPSE 日冕：纸底点刻，日冕流光、钻石环、仪器边框
   ============================================================ */
function eclipse(){
 const r=mk(303),vn=makeNoise(5),cx=400,cy=392,Rm=112,dAng=-.85;
 const fr=`<path class="line" d="M48 100V48H100M700 48H752M752 700V752H700M100 752H48V700" stroke="#111214" stroke-width="1.2" opacity=".6"/>
${[[48,400],[752,400],[400,48],[400,752]].map(([x,y])=>`<path class="line" d="M${x-9} ${y}H${x+9}M${x} ${y-9}V${y+9}" stroke="#111214" opacity=".5"/>`).join("")}`;
 setScene(`${fr}<g transform="translate(${cx} ${cy})">
<g class="spin2" opacity=".6">${anchor(372)}${ticks(366,144,10,4,12,"#111214",.55)}</g>
<circle class="line" r="156" stroke="#111214" opacity=".35" stroke-dasharray="1 6"/>
<circle class="line" r="228" stroke="#111214" opacity=".3" stroke-dasharray="1 8"/>
<circle class="line" r="306" stroke="#111214" opacity=".28" stroke-dasharray="1 10"/>
<path d="M${f1(Math.cos(dAng)*(Rm+3))} ${f1(Math.sin(dAng)*(Rm+3)-9)}L${f1(Math.cos(dAng)*(Rm+3)+6)} ${f1(Math.sin(dAng)*(Rm+3))}L${f1(Math.cos(dAng)*(Rm+3))} ${f1(Math.sin(dAng)*(Rm+3)+9)}L${f1(Math.cos(dAng)*(Rm+3)-6)} ${f1(Math.sin(dAng)*(Rm+3))}Z" fill="#b8921a"/>
</g>`,ctx=>{
  ctx.fillStyle="#111214";
  const lumps=[[.35,.2,1],[1.9,.16,.9],[3.3,.24,1],[4.5,.18,.8],[5.7,.15,.7],[2.7,.08,.5],[.95,.07,.45],[4.0,.07,.4]];
  const lump=a=>{let v=0;for(const[l,w,k]of lumps){const d=Math.abs(((a-l+Math.PI)%TAU+TAU)%TAU-Math.PI);v+=k*Math.exp(-d*d/(2*w*w))}return v};
  for(let i=0;i<190000;i++){
   const a=r.f()*TAU,rad=Rm+Math.pow(r.f(),2.3)*330,lv=lump(a);
   const e=1.9-.9*Math.min(1,lv),fall=Math.pow(Rm/rad,e),nz=.55+.9*vn(a*2.2+3,rad*.018);
   let p=(.1+lv)*fall*nz*1.15;
   const dd=Math.abs(((a-dAng+Math.PI)%TAU+TAU)%TAU-Math.PI);if(dd<.1&&rad<Rm+36)continue;
   if(r.f()<Math.min(1,p)){const s=rad<Rm+25?r(.4,1.1):r(.25,.8);dot(ctx,cx+Math.cos(a)*rad,cy+Math.sin(a)*rad,s,r(.4,.95))}
  }
  for(let i=0;i<1800;i++){const a=r.f()*TAU,d=140+Math.pow(r.f(),1.5)*320;dot(ctx,cx+Math.cos(a)*d,cy+Math.sin(a)*d,r(.25,.6),r(.1,.35))}
  for(let i=0;i<40;i++){const a=r.f()*TAU,d=r(150,380);dot(ctx,cx+Math.cos(a)*d,cy+Math.sin(a)*d,r(1,2.6),r(.6,1))}
  ctx.globalAlpha=1;ctx.beginPath();ctx.arc(cx,cy,Rm,0,TAU);ctx.fillStyle="#111214";ctx.fill();
  ctx.fillStyle="#e9e8e2";for(let i=0;i<5200;i++){const a=r.f()*TAU,d=Rm*(1-Math.pow(r.f(),3.2)*.22);if(Math.abs(((a-dAng+Math.PI)%TAU+TAU)%TAU-Math.PI)>1.6&&r.f()<.8)continue;dot(ctx,cx+Math.cos(a)*d,cy+Math.sin(a)*d,r(.25,.6),r(.08,.3))}
  ctx.strokeStyle="#e9e8e2";ctx.lineWidth=2.4;ctx.globalAlpha=1;ctx.beginPath();ctx.arc(cx,cy,Rm+2.4,0,TAU);ctx.stroke();
 })
}

/* ---------- 模式表与切换 ---------- */
const MODES=[
 {id:"spiral",n:"01 SPIRAL",cap:"SPIRAL",sub:"HOURS · 时之螺旋",theme:"dark",draw:spiral},
 {id:"horizon",n:"02 HORIZON",cap:"HORIZON",sub:"EVENT HORIZON · 视界",theme:"dark",draw:horizon},
 {id:"edgeon",n:"03 EDGE-ON",cap:"EDGE-ON",sub:"GALAXY · 你在这里",theme:"dark",draw:edgeon},
 {id:"foucault",n:"04 FOUCAULT",cap:"FOUCAULT",sub:"PENDULUM · 大地在转",theme:"dark",draw:foucault},
 {id:"ouroboros",n:"05 OUROBOROS",cap:"OUROBOROS",sub:"ETERNAL RETURN · 衔尾蛇 · 全视",theme:"dark",draw:ouroboros},
 {id:"enso",n:"06 ENSO",cap:"ENSO",sub:"EMPTINESS · 空",theme:"paper",dust:true,draw:enso},
 {id:"phase",n:"07 PHASE",cap:"PHASE",sub:"LIGHT / SHADOW · 盈亏",theme:"paper",draw:phase},
 {id:"eclipse",n:"08 ECLIPSE",cap:"ECLIPSE",sub:"CORONA · 日冕",theme:"paper",dust:true,draw:eclipse},
];
ui.innerHTML=MODES.map(m=>`<button type="button" data-m="${m.id}" aria-pressed="false">${m.n}</button>`).join("");
const btns=[...ui.querySelectorAll("button")];
let want=0,token=0;
function render(m){
 cur=m;want=MODES.indexOf(m);
 document.body.dataset.theme=m.theme;
 $("#themeColor").content=m.theme==="paper"?"#e9e8e2":"#050506";
 capEl.textContent=m.cap;subEl.textContent=m.sub;
 btns.forEach(b=>{const on=b.dataset.m===m.id;b.classList.toggle("active",on);b.setAttribute("aria-pressed",on);
  if(on)ui.scrollTo({left:b.offsetLeft-ui.clientWidth/2+b.clientWidth/2,behavior:RM?"auto":"smooth"})});
 m.draw();
 if(RM)backdrop(0);
 try{history.replaceState(null,"","#"+m.id)}catch(e){}
}
function setMode(id){
 const m=MODES.find(x=>x.id===id);if(!m||m===cur)return;
 const t=++token;
 if(RM||!cur){render(m);return}
 art.classList.add("out");
 setTimeout(()=>{if(t!==token)return;render(m);art.classList.remove("out")},260);
}
const go=i=>setMode(MODES[(i+MODES.length)%MODES.length].id);
ui.addEventListener("click",e=>{const b=e.target.closest("button");if(b)setMode(b.dataset.m)});
addEventListener("keydown",e=>{
 if(e.key==="ArrowRight")go(want+1);else if(e.key==="ArrowLeft")go(want-1);
 else if(/^[1-8]$/.test(e.key))go(+e.key-1)});
let sx0=0,sy0=0;
scene.addEventListener("touchstart",e=>{if(e.target.closest(".ui"))return;sx0=e.touches[0].clientX;sy0=e.touches[0].clientY},{passive:true});
scene.addEventListener("touchend",e=>{if(e.target.closest(".ui"))return;const t=e.changedTouches[0],dx_=t.clientX-sx0,dy_=t.clientY-sy0;
 if(Math.abs(dx_)>60&&Math.abs(dx_)>Math.abs(dy_)*1.5)go(want+(dx_<0?1:-1))},{passive:true});

resize();
render(MODES.find(m=>m.id===location.hash.slice(1))||MODES[0]);
if(!RM)raf=requestAnimationFrame(frame);
</script>
